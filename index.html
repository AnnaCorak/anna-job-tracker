<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#243d38"><meta name="description" content="Privatni tracker prijava za posao"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Anna · Job Tracker</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#243d38;background:#f7f5ef}*{box-sizing:border-box}body{margin:0}.wrap{max-width:680px;margin:auto;padding:24px 16px 100px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:29px;margin:3px 0}h2{font-size:18px}.muted{color:#718079;font-size:13px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;color:#a37655}.primary{background:#243d38;color:white;border:0}button,.btn{font:inherit;cursor:pointer;border-radius:12px;padding:11px 14px;border:1px solid #d9ded8;background:white;color:#243d38}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d5a781}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 0}.stat,.job,.empty{background:white;border:1px solid #e8e7e0;border-radius:18px;padding:16px}.stat strong{font-size:27px;display:block}.stat span{font-size:12px;color:#718079}.tools{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}input,select,textarea{width:100%;border:1px solid #d9ded8;border-radius:11px;padding:12px;font:inherit;background:white;color:#243d38}.tools input{flex:2;min-width:160px}.tools select{flex:1;min-width:135px}.job{margin:10px 0}.jobtop{display:flex;justify-content:space-between;gap:12px;align-items:start}.job h3{margin:0 0 5px;font-size:17px}.pill{border-radius:99px;background:#edf1eb;padding:5px 9px;font-size:11px;white-space:nowrap}.details{font-size:13px;color:#718079;margin:8px 0;overflow-wrap:anywhere}.notes{white-space:pre-wrap;font-size:13px;margin:10px 0}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.actions button{font-size:13px;padding:8px 11px}.actions a{font-size:13px;align-self:center;color:#436b60}.footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:25px}dialog{width:min(94vw,540px);max-height:90vh;border:0;border-radius:20px;padding:22px;box-shadow:0 20px 70px #0004}dialog::backdrop{background:#152b2677}form label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.empty{text-align:center;padding:30px;color:#718079}.small{font-size:12px}.warning{color:#8c543b}a{color:#436b60}@media(max-width:390px){header h1{font-size:24px}header button{padding:10px}.formactions button{padding:9px}form .row{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header><div><div class="eyebrow">ANNA 4.0 / CAREER HQ</div><h1>Job Tracker ✦</h1><div class="muted">Sve prijave. Jedno mirno mjesto.</div></div><button class="primary" id="add">＋ Nova</button></header><section class="stats"><div class="stat"><strong id="total">0</strong><span>Ukupno</span></div><div class="stat"><strong id="active">0</strong><span>Aktivno</span></div><div class="stat"><strong id="interviews">0</strong><span>Intervjui</span></div></section><h2>Moje prijave</h2><div class="tools"><input id="search" placeholder="Traži tvrtku ili poziciju…" aria-label="Pretraži prijave"><select id="filter" aria-label="Filtriraj po statusu"><option value="">Svi statusi</option></select></div><div id="jobs"></div><div class="footer"><button id="export">↓ Sigurnosna kopija</button><button id="import">↑ Vrati kopiju</button><input type="file" id="file" accept="application/json,.json" hidden></div><p class="muted small">Podaci su samo u ovom pregledniku na ovom uređaju. Redovito spremi sigurnosnu kopiju. Nemoj brisati podatke preglednika prije izvoza.</p></main><dialog id="editor"><form id="form"><h2 id="formtitle">Nova prijava</h2><input type="hidden" name="id"><label for="company">Tvrtka *</label><input id="company" name="company" required maxlength="120"><label for="role">Pozicija *</label><input id="role" name="role" required maxlength="160"><div class="row"><div><label for="status">Status</label><select id="status" name="status"></select></div><div><label for="date">Datum prijave</label><input type="date" id="date" name="date"></div></div><label for="location">Lokacija</label><input id="location" name="location" maxlength="120" placeholder="Zagreb / hibridno / remote"><label for="url">Poveznica na oglas</label><input id="url" name="url" type="url" placeholder="https://..."><div class="row"><div><label for="rating">Koliko me zanima?</label><select id="rating" name="rating"><option value="">Bez ocjene</option><option value="1">1 / 5</option><option value="2">2 / 5</option><option value="3">3 / 5</option><option value="4">4 / 5</option><option value="5">5 / 5</option></select></div><div><label for="deadline">Rok prijave</label><input type="date" id="deadline" name="deadline"></div></div><label for="notes">Bilješke / dojmovi</label><textarea id="notes" name="notes" rows="4" placeholder="Plaća, red flags, razgovor…"></textarea><div class="formactions"><button type="button" id="cancel">Odustani</button><button class="primary" type="submit">Spremi prijavu</button></div></form></dialog><script>
const KEY='anna-job-tracker-v1';const statuses=['Spremljeno','Prijavljeno','Intervju','Ponuda','Odbijeno','Odustala'];const $=id=>document.getElementById(id);let jobs=[];try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');jobs=Array.isArray(raw)?raw:[]}catch{alert('Nije moguće učitati spremljene podatke. Nemoj dodavati prijave prije provjere sigurnosne kopije.')}for(const s of statuses){for(const id of ['status','filter']){const o=document.createElement('option');o.value=s;o.textContent=s;$(id).append(o)}}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const validUrl=s=>{try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}};function save(){try{localStorage.setItem(KEY,JSON.stringify(jobs));return true}catch{alert('Spremanje nije uspjelo. Izvezi sigurnosnu kopiju i provjeri prostor preglednika.');return false}}function render(){const q=$('search').value.toLocaleLowerCase('hr'),f=$('filter').value;const shown=jobs.filter(j=>(!f||j.status===f)&&[j.company,j.role,j.notes].some(v=>String(v||'').toLocaleLowerCase('hr').includes(q))).sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));$('total').textContent=jobs.length;$('active').textContent=jobs.filter(j=>['Spremljeno','Prijavljeno','Intervju'].includes(j.status)).length;$('interviews').textContent=jobs.filter(j=>j.status==='Intervju').length;$('jobs').innerHTML=shown.length?shown.map(j=>`<article class="job"><div class="jobtop"><div><h3>${esc(j.company)}</h3><div>${esc(j.role)}</div></div><span class="pill">${esc(j.status)}</span></div><div class="details">${[j.location,j.date?'Prijava: '+j.date:'',j.deadline?'Rok: '+j.deadline:'',j.rating?'Interes: '+j.rating+'/5':''].filter(Boolean).map(esc).join(' · ')}</div>${j.notes?`<div class="notes">${esc(j.notes)}</div>`:''}<div class="actions"><button data-edit="${esc(j.id)}">Uredi</button><button data-delete="${esc(j.id)}">Obriši</button>${validUrl(j.url)?`<a href="${esc(validUrl(j.url))}" target="_blank" rel="noopener noreferrer">Otvori oglas ↗</a>`:''}</div></article>`).join(''):'<div class="empty">Još nema prijava za ovaj prikaz. ✨</div>'}function edit(j){$('form').reset();for(const k of ['id','company','role','status','date','location','url','rating','deadline','notes'])$('form').elements[k].value=j?.[k]||'';$('formtitle').textContent=j?'Uredi prijavu':'Nova prijava';$('editor').showModal()}$('add').onclick=()=>edit(null);$('cancel').onclick=()=>$('editor').close();$('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));d.company=d.company.trim();d.role=d.role.trim();if(!d.company||!d.role)return;d.id=d.id||((globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+'-'+Math.random());d.updated=new Date().toISOString();const previous=jobs.slice();jobs=jobs.filter(j=>j.id!==d.id).concat(d);if(!save()){jobs=previous;return}$('editor').close();render()};$('jobs').onclick=e=>{const editId=e.target.closest('[data-edit]')?.dataset.edit,deleteId=e.target.closest('[data-delete]')?.dataset.delete;if(editId)edit(jobs.find(j=>j.id===editId));if(deleteId&&confirm('Obrisati ovu prijavu?')){const prev=jobs.slice();jobs=jobs.filter(j=>j.id!==deleteId);if(!save())jobs=prev;render()}};for(const id of ['search','filter'])$(id).addEventListener('input',render);$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'anna-job-tracker',version:1,exported:new Date().toISOString(),jobs},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='anna-job-tracker-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(d.app!=='anna-job-tracker'||!Array.isArray(d.jobs)||d.jobs.some(j=>!j||typeof j.id!=='string'||typeof j.company!=='string'||typeof j.role!=='string'||!statuses.includes(j.status)))throw Error('Neispravna datoteka');if(!confirm('Uvoz će zamijeniti sve trenutačne prijave. Nastaviti?'))return;const prev=jobs;jobs=d.jobs;if(!save()){jobs=prev;return}render();alert('Sigurnosna kopija je vraćena.')}catch(err){alert('Uvoz nije uspio: '+err.message)}finally{e.target.value=''}};render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
